{% from "components/common/upload.html" import multi_upload %}
<section class="space-y-4" aria-labelledby="video-analysis-heading">
  <div>
    <h2 id="video-analysis-heading" class="text-lg font-semibold text-base-content">Video Analysis</h2>
    <p class="mt-1 text-sm text-base-content/70">Upload MP4 files. Defect detection runs automatically via YOLO + SAHI.</p>
  </div>
  {{ multi_upload("ai-upload-video", "Video files", "MP4 only. Multiple videos supported.", category="video", accept="video/mp4,.mp4") }}
  <div id="detection-container" data-category="video"></div>
</section>
